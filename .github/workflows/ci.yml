name: CI

# When to run: every pull request, and every push to main (proves the merged result still passes).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # caches downloaded packages between runs, keyed on uv.lock

      - name: Install dependencies from the lock file
        run: uv sync --frozen # --frozen: fail if pyproject and uv.lock disagree; never re-resolve in CI

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v

  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: ai-ta-api:ci
          cache-from: type=gha # reuse layers from previous CI runs
          cache-to: type=gha,mode=max
