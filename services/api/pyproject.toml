[project]
name = "ai-ta-api"
version = "0.1.0"
description = "FastAPI service: health now; chat, quiz, auth, conversations later."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",  # ASGI server that runs the app; [standard] adds fast event loop + websockets
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
