[project]
name = "ai-ta"
version = "0.1.0"
description = "Personal rebuild of an AI teaching-assistant platform: RAG over Pinecone + Neo4j, MongoDB, LiveKit voice, on Docker/Kubernetes/AWS."
requires-python = ">=3.12"
# The root project depends on the workspace members; each member lists its own runtime deps.
dependencies = [
    "ai-ta-api",
]

# Tools needed to develop and test, but never shipped in a production image.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx>=0.27",  # FastAPI TestClient needs it
]

# ---- uv workspace: one venv + one lock file, many packages/services ----
[tool.uv.workspace]
members = ["services/api"]

[tool.uv.sources]
ai-ta-api = { workspace = true }

# ---- tool configuration ----

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import sorting, UP = modern syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Our own packages sort after third-party imports, in their own group.
known-first-party = ["ai_ta_api", "ai_ta_ingest"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
